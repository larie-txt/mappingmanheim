<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mapping Manheim again</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            display: block;
            position: absolute;
            outline: 0;
        }

        #startNFC {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;

            padding: 12px 18px;
            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 16px;
            cursor: pointer;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1"
    >

    <meta itemprop="name" content="Mapping Manheim again">
    <meta itemprop="description" content="made with cables">
    <meta itemprop="image" content="screenshot.png">
    <meta name="description" content="made with cables"/>
</head>

<body>

    <canvas
        id="glcanvas"
        width="100vw"
        height="100vh"
        tabindex="1"
    ></canvas>

    <!-- NFC START BUTTON -->
    <button id="startNFC">
        Start NFC
    </button>

    <!-- CABLES PATCH -->
    <script
        type="text/javascript"
        src="js/patch.js"
        async
    ></script>

    <!-- NFC SCRIPT -->
    <script
        type="text/javascript"
        src="js/nfc.js"
        defer
    ></script>

    <script type="text/javascript">

        function showError(initiator, ...args)
        {
            CABLES.logErrorConsole("[" + initiator + "]", ...args);
        }

        function patchInitialized(patch)
        {
            console.log("Patch initialized");
        }

        function patchFinishedLoading(patch)
        {
            console.log("Patch finished loading");
        }

        document.addEventListener("CABLES.jsLoaded", function ()
        {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,

                "prefixAssetPath": "",
                "assetPath": "assets/",
                "jsPath": "js/",

                "glCanvasId": "glcanvas",
                "glCanvasResizeToWindow": true,

                "onError": showError,
                "onPatchLoaded": patchInitialized,
                "onFinishedLoading": patchFinishedLoading,

                "canvas": {
                    "alpha": true,
                    "premultipliedAlpha": true
                }
            });
        });

        // disable rubberband effect on mobile
        document
            .getElementById("glcanvas")
            .addEventListener(
                "touchmove",
                (e) => { e.preventDefault(); },
                false
            );

    </script>
</body>
</html>
