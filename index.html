<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fading Manheim</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            display: block;
            position: absolute;
            outline: 0;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* NFC button hidden by default */
        .nfc-button {
            display: none;
        }

        /* only show on phone/tablet */
        @media (max-width: 768px) {
            .nfc-button {
                display: block;

                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);

                z-index: 9999;

                padding: 14px 24px;

                border: none;
                border-radius: 999px;

                background: rgba(255,255,255,0.9);
                color: #000;

                font-size: 16px;
                font-weight: 600;
                font-family: Helvetica, Arial, sans-serif;

                cursor: pointer;
            }
        }
    </style>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1">

    <meta itemprop="name" content="Fading Manheim">
    <meta itemprop="description" content="made with cables">
    <meta itemprop="image" content="screenshot.png">

    <meta
        name="description"
        content="made with cables"/>
</head>

<body>

    <canvas
        id="glcanvas"
        width="100vw"
        height="100vh"
        tabindex="1"></canvas>

    <!-- NFC button -->
    <button id="startNFC" class="nfc-button">
        Start NFC
    </button>

    <!-- Cables export -->
    <script
        type="text/javascript"
        src="js/patch.js"
        async></script>

    <script type="text/javascript">

        function showError(initiator, ...args)
        {
            CABLES.logErrorConsole("[" + initiator + "]", ...args);
        }

        function patchInitialized(patch)
        {
            console.log("Patch initialized");
        }

        function patchFinishedLoading(patch)
        {
            console.log("Patch finished loading");
        }

        document.addEventListener("CABLES.jsLoaded", function ()
        {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                prefixAssetPath: "",
                assetPath: "assets/",
                jsPath: "js/",
                glCanvasId: "glcanvas",
                glCanvasResizeToWindow: true,
                onError: showError,
                onPatchLoaded: patchInitialized,
                onFinishedLoading: patchFinishedLoading,
                canvas: {
                    alpha: true,
                    premultipliedAlpha: true
                }
            });
        });

        // disable rubber-band scrolling on mobile
        document
            .getElementById("glcanvas")
            .addEventListener(
                "touchmove",
                (e) => {
                    e.preventDefault();
                },
                { passive: false }
            );

    </script>

    <!-- NFC Script -->
    <script
        type="module"
        src="js/NFC_script.js"></script>

</body>
</html>
