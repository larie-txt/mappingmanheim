<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mapping Manheim again</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden; /* disable scrolling / rubberband effect on mobile */
            height: 100vh;
        }

        canvas {
            display: block;
            position: absolute;
            outline: 0;
        }

        #startNFC {
            position: absolute;
            z-index: 10;
            top: 20px;
            left: 20px;
            padding: 12px 18px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            cursor: pointer;
        }

        * {
            /* disable on touch highlights of html elements, especially on mobile! */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

    </style>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta itemprop="name" content="Mapping Manheim again">
    <meta itemprop="description" content="made with cables">
    <meta itemprop="image" content="screenshot.png">
    <meta name="description" content="made with cables"/>

</head>
<body>
    <button id="startNFC">Start NFC</button>

    <canvas id="glcanvas" tabindex="1"></canvas>

    <script type="text/javascript" src="js/patch.js"></script>

    <script type="text/javascript">

        function showError(initiator, ...args)
        {
            CABLES.logErrorConsole("[" + initiator + "]", ...args);
        }

        function patchInitialized(patch)
        {
            console.log("Patch initialized");
        }

        function patchFinishedLoading(patch)
        {
            console.log("Patch finished loading");

            // Make the patch globally accessible for NFC_script.js
            window.cablesPatch = patch;

            // Default NFC value
            patch.setVariable("nfcNumber", 0);
        }

        document.addEventListener("CABLES.jsLoaded", function (event)
        {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                "prefixAssetPath": "",
                "assetPath": "assets/",
                "jsPath": "js/",
                "glCanvasId": "glcanvas",
                "glCanvasResizeToWindow": true,
                "onError": showError,
                "onPatchLoaded": patchInitialized,
                "onFinishedLoading": patchFinishedLoading,
                "canvas": {"alpha": true, "premultipliedAlpha": true } // make canvas transparent
            });
        });

        // disable rubberband effect on mobile devices
        document.getElementById('glcanvas').addEventListener('touchmove', (e) => { e.preventDefault(); }, false);
    </script>

    <script src="NFC_script.js"></script>
</body>
</html>
